<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Cash Report</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg:#fff; --card-bg:#f7f6f2; --border:#dfdcd3; --muted:#6b6a66; --text:#1f1e1c;
    --accent:#185fa5; --accent-bg:#e6f1fb; --danger:#a32d2d; --danger-bg:#fcebeb;
    --success:#3b6d11; --success-bg:#eaf3de; --out:#9a5b13; --out-bg:#fbf0e1; --radius:8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#26282c; --card-bg:#303338; --border:#45484e; --muted:#9a9da2; --text:#eceef0;
      --accent:#5b9bd5; --accent-bg:#2b3a4a; --danger:#e88a8a; --danger-bg:#4a2b2b;
      --success:#93c47d; --success-bg:#2b3f26; --out:#e0a85c; --out-bg:#43361f;
    }
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         color:var(--text); background:var(--bg); margin:0; padding:10px 12px; font-size:12.5px; }
  h1 { font-size:15px; margin:0; font-weight:700; }
  h2 { font-size:11px; margin:12px 0 5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  h2.sec { font-size:12.5px; color:var(--text); border-bottom:2px solid var(--border); padding-bottom:3px; margin-top:12px; }
  h2.sec.out { border-color:var(--out); }
  h2.sec.in { border-color:var(--accent); }
  .bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .bar .grow { flex:1; }
  .seg { display:inline-flex; }
  .seg button { border-radius:0; margin-left:-1px; }
  .seg button:first-child { border-radius:6px 0 0 6px; margin-left:0; }
  .seg button:last-child { border-radius:0 6px 6px 0; }
  input[type=date], input[type=month], select {
    height:26px; padding:0 6px; border:1px solid var(--border); border-radius:6px;
    font:inherit; color:var(--text); background:var(--bg);
  }
  button { font:inherit; font-weight:600; height:26px; padding:0 10px; border-radius:6px;
           border:1px solid var(--border); background:var(--card-bg); color:var(--text); cursor:pointer; }
  button:hover { background:var(--border); }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .cards { display:flex; gap:6px; flex-wrap:wrap; }
  .card { background:var(--card-bg); border-radius:6px; padding:6px 10px; min-width:110px; }
  .card .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .card .v { font-size:15px; font-weight:700; }
  .card.main .v { color:var(--accent); }
  .card.outc .v { color:var(--out); }
  .card.net { border:1px solid var(--border); }
  .pos { display:flex; gap:6px; flex-wrap:wrap; align-items:stretch; margin-bottom:4px; }
  .pos .op { align-self:center; font-size:16px; color:var(--muted); font-weight:700; }
  .wrap { overflow:auto; border:1px solid var(--border); border-radius:var(--radius); }
  table { border-collapse:collapse; width:100%; }
  th { position:sticky; top:0; background:var(--card-bg); font-size:10px; color:var(--muted);
       text-transform:uppercase; letter-spacing:.03em; padding:5px 6px; text-align:right;
       border-bottom:1px solid var(--border); white-space:nowrap; z-index:1; }
  td { padding:3px 6px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap;
       font-variant-numeric:tabular-nums; }
  th.l, td.l { text-align:left; }
  td.wrapc { white-space:normal; min-width:160px; max-width:320px; }
  td.z { color:var(--border); }
  tr.tot td { font-weight:700; background:var(--card-bg); border-top:2px solid var(--border); }
  tr.err td { background:var(--danger-bg); }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:var(--accent-bg); }
  .pill { display:inline-block; padding:0 6px; border-radius:999px; font-size:10.5px; font-weight:600; }
  .pill.ok { background:var(--success-bg); color:var(--success); }
  .pill.bad { background:var(--danger-bg); color:var(--danger); }
  .pill.pt { background:var(--out-bg); color:var(--out); }
  .flags { margin:0; padding-left:18px; color:var(--danger); }
  .muted { color:var(--muted); }
  .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; align-items:start; }
  .kpis { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 5px; color:var(--muted); font-size:11.5px; }
  .kpis b { color:var(--text); }
  .grid2 { display:grid; grid-template-columns:minmax(300px,440px) 1fr; gap:10px; align-items:start; }
  @media (max-width:760px) { .grid2 { grid-template-columns:1fr; } }
  .bar-cell { position:relative; }
  .bar-cell span.fill { position:absolute; left:0; top:3px; bottom:3px; background:var(--accent-bg); border-radius:3px; z-index:0; }
  .bar-cell.o span.fill { background:var(--out-bg); }
  .bar-cell span.txt { position:relative; z-index:1; }
  .neg { color:var(--danger); }
  @media print {
    .noprint { display:none !important; }
    body { padding:0; font-size:10.5px; }
    .wrap { overflow:visible; border:none; max-height:none !important; }
    th { position:static; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1 id="title">Daily Cash Report</h1>
  <span class="grow"></span>
  <span class="seg noprint">
    <button id="vBoth" class="on">Both</button><button id="vIn">Collections</button><button id="vOut">Payments</button>
  </span>
  <span class="seg noprint">
    <button id="mDay" class="on">Day</button><button id="mMonth">Month</button>
  </span>
  <span class="noprint" id="dayCtl">
    <button id="prev" title="Previous day with entries">◀</button>
    <input type="date" id="day">
    <button id="next" title="Next day with entries">▶</button>
    <button id="latest">Latest</button>
  </span>
  <span class="noprint" id="monthCtl" style="display:none"><input type="month" id="month"></span>
  <select id="handler" class="noprint" title="Filter by account handler"><option value="">All handlers</option></select>
  <button id="allLines" class="noprint" title="Show lines with no amount">All lines</button>
  <button id="print" class="noprint">Print</button>
</div>

<div id="posBox"></div>
<div id="monthBox"></div>
<div id="sumGrid" class="grid3"></div>
<div id="entries"></div>

<p class="muted" style="margin-top:8px">Tax = collection amount less fee and contribution lines (the balancing figure).
Client-tagged payments are pass-through (paid for clients), not office expenses. Jan–Jun 2026 entries were archived out of Grist and are not shown.</p>

<script>
// ---------- Collections buckets (dRpt order) ----------
const IN_B = [
  { key:'monthly_fees',     label:'Monthly',    grp:'fee' },
  { key:'quarterly_fees',   label:'Quarterly',  grp:'fee' },
  { key:'annual_fees',      label:'Annual',     grp:'fee' },
  { key:'quarterly_annual', label:'Q/A (old)',  grp:'fee', legacy:true },
  { key:'iar_fees',         label:'IAR',        grp:'fee' },
  { key:'other_fees',       label:'Other Fees', grp:'fee' },
  { key:'printing',         label:'Printing',   grp:'fee' },
  { key:'sss',              label:'SSS',        grp:'contri' },
  { key:'phic',             label:'PHIC',       grp:'contri' },
  { key:'hdmf',             label:'HDMF',       grp:'contri' },
  { key:'others_permits',   label:'Permits',    grp:'contri' },
  { key:'tax',              label:'Tax',        grp:'tax' },
];
// ---------- Payment line columns (labels replaced by the doc's own labels when available) ----------
const OUT_COLS = [
  { key:'salary_benefits_amount', label:'Salary' },
  { key:'sss_employer_amount',    label:'SSS' },
  { key:'phic_employer_amount',   label:'PHIC' },
  { key:'hdmf_employer_amount',   label:'HDMF' },
  { key:'contri_others_amount',   label:"Client's Expenses" },
  { key:'fare_gas_amount',        label:'Fare/Gas' },
  { key:'meals_amount',           label:'Misc' },
  { key:'others_amount2',         label:'Others' },
];
const LEGACY_CATS = ['Deposit/Remit/GCash', 'Rent/Utilities/Comm', 'Supplies', 'Personal'];

let cols = [], pays = [], clients = {}, office = '';
let showAll = false;
let view = 'both', mode = 'day', curDay = null, curMonth = null;

const $ = id => document.getElementById(id);
const n = v => (typeof v === 'number' && isFinite(v) ? v : 0);
const peso = v => (v < 0 ? '-₱' : '₱') + Math.abs(Math.round(v)).toLocaleString('en-PH');
const cell = v => Math.round(v) === 0 ? '<td class="z">–</td>' : `<td>${peso(v)}</td>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isoOf = ts => new Date(ts * 1000).toISOString().slice(0, 10);
const nice = iso => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-PH',
  { timeZone:'UTC', weekday:'short', month:'short', day:'numeric', year:'numeric' });
const niceMonth = ym => new Date(ym + '-01T00:00:00Z').toLocaleDateString('en-PH',
  { timeZone:'UTC', month:'long', year:'numeric' });
const sum = (list, key) => list.reduce((s, r) => s + n(r[key]), 0);
const isCash = m => String(m || '').toLowerCase() === 'cash';

async function labelsFromDoc() {
  try {
    const [T, C] = await Promise.all([grist.docApi.fetchTable('_grist_Tables'), grist.docApi.fetchTable('_grist_Tables_column')]);
    const tRef = T.id[T.tableId.indexOf('Cash_disbursements')];
    C.id.forEach((_, i) => {
      if (C.parentId[i] !== tRef) return;
      const c = OUT_COLS.find(o => o.key === C.colId[i]);
      if (c && C.label[i]) c.label = C.label[i];
    });
  } catch (e) { /* keep defaults */ }
}

async function load() {
  const [c, t, p] = await Promise.all([
    grist.docApi.fetchTable('Clients'),
    grist.docApi.fetchTable('Daily_cash_collections'),
    grist.docApi.fetchTable('Cash_disbursements').catch(() => null),
  ]);
  clients = {};
  (c.id || []).forEach((id, i) => clients[id] = { code: c.A?.[i] || '', handler: c.C?.[i] || '' });

  cols = (t.id || []).map((_, i) => i).filter(i => typeof t.B[i] === 'number').map(i => {
    const r = { id: t.id[i], date: isoOf(t.B[i]), amount: n(t.amount?.[i]), method: t.method?.[i] || '—', client: t.client?.[i] || 0 };
    if (!office && t.C?.[i]) office = t.C[i];
    let fees = 0;
    for (const b of IN_B) if (b.key !== 'tax') { r[b.key] = n(t[b.key]?.[i]); if (b.grp === 'fee') fees += r[b.key]; }
    r.fees = fees;
    r.contri = r.sss + r.phic + r.hdmf + r.others_permits;
    r.tax = Math.round(r.amount - fees - r.contri);
    const cl = clients[r.client]; r.code = cl ? cl.code : ''; r.handler = cl ? cl.handler : '';
    return r;
  }).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);

  pays = !p ? [] : (p.id || []).map((_, i) => i).filter(i => typeof p.date[i] === 'number').map(i => {
    const r = { id: p.id[i], date: isoOf(p.date[i]), method: p.payment_method?.[i] || '—', client: p.client?.[i] || 0,
                desc: p.description?.[i] || '', odesc: p.others_description?.[i] || '', cat: p.category?.[i] || '' };
    if (!office && p.office?.[i]) office = p.office[i];
    let lines = 0;
    for (const o of OUT_COLS) { r[o.key] = n(p[o.key]?.[i]); lines += r[o.key]; }
    // legacy rows: Category + Amount (only counted when the category is one of the old ones)
    r.legacy = LEGACY_CATS.includes(r.cat) ? n(p.amount?.[i]) : 0;
    r.total = p.total_amount ? n(p.total_amount[i]) : lines + r.legacy;
    r.lines = lines + r.legacy;
    const cl = clients[r.client]; r.code = cl ? cl.code : ''; r.handler = cl ? cl.handler : '';
    return r;
  }).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);

  $('title').textContent = 'Daily Cash Report' + (office ? ' — ' + office : '');
  const hs = [...new Set(cols.concat(pays).map(r => r.handler).filter(Boolean))].sort();
  const sel = $('handler'), keep = sel.value;
  sel.innerHTML = '<option value="">All handlers</option>' + hs.map(h => `<option>${esc(h)}</option>`).join('');
  sel.value = hs.includes(keep) ? keep : '';
  if (!curDay) { const last = allDays().pop(); curDay = last || null; }
  if (!curMonth && curDay) curMonth = curDay.slice(0, 7);
  render();
}

function allDays() {
  const src = view === 'in' ? cols : view === 'out' ? pays : cols.concat(pays);
  return [...new Set(src.map(r => r.date))].sort();
}
function scope(list) {
  const h = $('handler').value;
  return list.filter(r => (mode === 'day' ? r.date === curDay : r.date.slice(0, 7) === curMonth) && (!h || r.handler === h));
}
function methodsOf(list) {
  return [...new Set(list.map(r => r.method))].sort((a, b) => isCash(a) ? -1 : isCash(b) ? 1 : a.localeCompare(b));
}
function period() { return mode === 'day' ? (curDay ? nice(curDay) : '—') : (curMonth ? niceMonth(curMonth) : '—'); }

// ---------- Cash position ----------
function renderPosition(I, O) {
  const cin = sum(I.filter(r => isCash(r.method)), 'amount'), cout = sum(O.filter(r => isCash(r.method)), 'total');
  const nin = sum(I.filter(r => !isCash(r.method)), 'amount'), nout = sum(O.filter(r => !isCash(r.method)), 'total');
  const net = cin - cout;
  const h = $('handler').value;
  $('posBox').innerHTML = `
    <div class="pos">
      <div class="card main"><div class="k">Cash in · ${esc(period())}</div><div class="v">${peso(cin)}</div></div>
      <span class="op">−</span>
      <div class="card outc"><div class="k">Cash out</div><div class="v">${peso(cout)}</div></div>
      <span class="op">=</span>
      <div class="card net"><div class="k">Net cash</div><div class="v ${net < 0 ? 'neg' : ''}">${peso(net)}</div></div>
      <span style="width:14px"></span>
      <div class="card"><div class="k">Noncash in</div><div class="v">${peso(nin)}</div></div>
      <div class="card"><div class="k">Noncash out</div><div class="v">${peso(nout)}</div></div>
      <div class="card"><div class="k">Total in / out</div><div class="v">${peso(cin + nin)} / ${peso(cout + nout)}</div></div>
    </div>
    ${h ? `<div class="muted">Filtered to ${esc(h)}'s clients — untagged office payments are hidden, so this is not the office's cash position.</div>` : ''}`;
}

// ---------- Month: one row per day ----------
function renderMonthDays(I, O) {
  if (mode !== 'month') { $('monthBox').innerHTML = ''; return; }
  const days = [...new Set(I.concat(O).map(r => r.date))].sort();
  let b = `<tr><th class="l">Date</th><th>Cash in</th><th>Noncash in</th><th>Cash out</th><th>Noncash out</th><th>Net cash</th><th class="l">Checks</th></tr>`;
  let tot = [0, 0, 0, 0];
  for (const d of days) {
    const Ii = I.filter(r => r.date === d), Oo = O.filter(r => r.date === d);
    const v = [sum(Ii.filter(r => isCash(r.method)), 'amount'), sum(Ii.filter(r => !isCash(r.method)), 'amount'),
               sum(Oo.filter(r => isCash(r.method)), 'total'), sum(Oo.filter(r => !isCash(r.method)), 'total')];
    v.forEach((x, k) => tot[k] += x);
    const bad = issuesIn(Ii).length + issuesOut(Oo).length;
    b += `<tr class="click${bad ? ' err' : ''}" data-day="${d}"><td class="l">${esc(nice(d))}</td>${v.map(cell).join('')}
          <td class="${v[0] - v[2] < 0 ? 'neg' : ''}"><b>${peso(v[0] - v[2])}</b></td>
          <td class="l">${bad ? `<span class="pill bad">${bad} to check</span>` : '<span class="pill ok">OK</span>'}</td></tr>`;
  }
  if (days.length) b += `<tr class="tot"><td class="l">Total</td>${tot.map(cell).join('')}<td>${peso(tot[0] - tot[2])}</td><td></td></tr>`;
  $('monthBox').innerHTML = `<h2>By day (click a day to open it)</h2><div class="wrap" style="max-height:40vh"><table>${b}</table></div>`;
  document.querySelectorAll('#monthBox tr.click').forEach(tr => tr.onclick = () => { curDay = tr.dataset.day; mode = 'day'; render(); });
}

// ---------- Collections ----------
function issuesIn(list) {
  const f = [];
  for (const r of list) {
    const who = `${r.code || 'No client'}${mode === 'month' ? ' (' + r.date.slice(5) + ')' : ''} — ${peso(r.amount)}`;
    if (r.tax < 0) f.push(`${who}: fee + contribution lines exceed amount by ${peso(-r.tax)}`);
    if (!r.client) f.push(`${who}: no client tagged`);
    if (!r.amount) f.push(`${who}: zero amount`);
  }
  return f;
}
function distTable(list, buckets, amtKey, groups, cls) {
  const methods = methodsOf(list);
  const total = sum(list, amtKey);
  let d = `<tr><th class="l">Line</th>${methods.map(m => `<th>${esc(m)}</th>`).join('')}<th>Total</th><th>%</th></tr>`;
  const line = (label, key, bold) => {
    const v = sum(list, key), pct = total ? v / total * 100 : 0;
    if (!bold && !showAll && !Math.round(v)) return '';
    return `<tr class="${bold ? 'tot' : ''}"><td class="l">${label}</td>${methods.map(m => cell(sum(list.filter(r => r.method === m), key))).join('')}
      ${bold ? cell(v) : `<td class="bar-cell ${cls}"><span class="fill" style="width:${Math.max(0, Math.min(100, pct))}%"></span><span class="txt">${Math.round(v) ? peso(v) : '–'}</span></td>`}
      <td>${v ? Math.round(pct) + '%' : ''}</td></tr>`;
  };
  let last = null;
  for (const b of buckets) {
    if (groups && last && b.grp !== last && groups[last]) d += line(groups[last][0], groups[last][1], true);
    last = b.grp;
    d += line(b.label, b.key, false);
  }
  d += line(cls === 'o' ? 'Total paid' : 'Total collected', amtKey, true);
  return d;
}
function issuesOut(list) {
  const f = [];
  for (const r of list) {
    const who = `${r.code || r.desc || r.odesc || 'Payment #' + r.id}${mode === 'month' ? ' (' + r.date.slice(5) + ')' : ''} — ${peso(r.total)}`;
    if (r.others_amount2 && !r.odesc) f.push(`${who}: Others amount has no Others Description`);
    if (!r.total) f.push(`${who}: zero amount`);
    if (Math.abs(r.total - r.lines) >= 1) f.push(`${who}: lines (${peso(r.lines)}) don't add up to the total`);
  }
  return f;
}
function outBuckets(list) {
  // fixed columns first, then "Others" split by its description, then legacy categories
  const b = OUT_COLS.filter(o => o.key !== 'others_amount2').map(o => ({ key:o.key, label:o.label }));
  const descs = [...new Set(list.filter(r => r.others_amount2).map(r => r.odesc || '(no description)'))].sort();
  for (const d of descs) {
    const k = 'o:' + d;
    list.forEach(r => r[k] = (r.others_amount2 && (r.odesc || '(no description)') === d) ? r.others_amount2 : 0);
    b.push({ key:k, label:'Others – ' + d });
  }
  const cats = [...new Set(list.filter(r => r.legacy).map(r => r.cat))].sort();
  for (const c of cats) {
    const k = 'c:' + c;
    list.forEach(r => r[k] = r.cat === c ? r.legacy : 0);
    b.push({ key:k, label:c + ' (old category)' });
  }
  return b.filter(x => list.some(r => r[x.key]));
}

// ---------- Layout: distributions + checks side by side, entry lists full width below ----------
function inPanel(I) {
  const buckets = IN_B.filter(b => !b.legacy || I.some(r => r.quarterly_annual));
  const head = `<h2 class="sec in">Collections · ${peso(sum(I, 'amount'))} · ${I.length} entr${I.length === 1 ? 'y' : 'ies'}</h2>
    <div class="kpis"><span>Fees <b>${peso(sum(I,'fees'))}</b></span><span>Contributions <b>${peso(sum(I,'contri'))}</b></span><span>Tax <b>${peso(sum(I,'tax'))}</b></span></div>`;
  if (!I.length) return { panel: head + '<p class="muted">No collections for this period.</p>', entries: '' };
  const panel = head + `<div class="wrap"><table>${distTable(I, buckets, 'amount', { fee:['Fees subtotal','fees'], contri:['Contributions subtotal','contri'] }, '')}</table></div>`;
  let entries = '';
  if (mode === 'day') {
    const used = buckets.filter(b => showAll || I.some(r => Math.round(r[b.key])));
    let t = `<tr><th class="l">#</th><th class="l">Client</th><th class="l">Handler</th><th class="l">Method</th><th>Amount</th>${used.map(b => `<th>${b.label}</th>`).join('')}<th class="l">Check</th></tr>`;
    I.forEach((r, i) => {
      t += `<tr class="${r.tax < 0 ? 'err' : ''}"><td class="l muted">${i + 1}</td><td class="l">${esc(r.code || 'No client')}</td>
        <td class="l">${esc(r.handler)}</td><td class="l">${esc(r.method)}</td><td><b>${peso(r.amount)}</b></td>
        ${used.map(b => cell(r[b.key])).join('')}<td class="l">${r.tax < 0 ? '<span class="pill bad">Over</span>' : '<span class="pill ok">OK</span>'}</td></tr>`;
    });
    t += `<tr class="tot"><td class="l" colspan="4">Total</td><td>${peso(sum(I,'amount'))}</td>${used.map(b => cell(sum(I, b.key))).join('')}<td></td></tr>`;
    entries = `<h2>Collection entries</h2><div class="wrap" style="max-height:55vh"><table>${t}</table></div>`;
  }
  return { panel, entries };
}

function outPanel(O) {
  const pt = O.filter(r => r.client), off = O.filter(r => !r.client);
  const head = `<h2 class="sec out">Payments · ${peso(sum(O, 'total'))} · ${O.length} entr${O.length === 1 ? 'y' : 'ies'}</h2>
    <div class="kpis"><span>Office <b>${peso(sum(off,'total'))}</b></span><span>For clients (pass-through) <b>${peso(sum(pt,'total'))}</b></span></div>`;
  if (!O.length) return { panel: head + '<p class="muted">No payments for this period.</p>', entries: '' };
  const buckets = outBuckets(O);
  const panel = head + `<div class="wrap"><table>${distTable(O, buckets, 'total', null, 'o')}</table></div>`;
  let entries = '';
  if (mode === 'day') {
    let t = `<tr><th class="l">#</th><th class="l">For</th><th class="l">Description</th><th class="l">Method</th><th>Amount</th>${buckets.map(b => `<th>${esc(b.label)}</th>`).join('')}</tr>`;
    O.forEach((r, i) => {
      const bad = issuesOut([r]).length;
      t += `<tr class="${bad ? 'err' : ''}"><td class="l muted">${i + 1}</td>
        <td class="l">${r.client ? `<span class="pill pt">${esc(r.code)}</span>` : '<span class="muted">Office</span>'}</td>
        <td class="l wrapc">${esc([r.desc, r.odesc && !r.desc.includes(r.odesc) ? r.odesc : ''].filter(Boolean).join(' · '))}</td>
        <td class="l">${esc(r.method)}</td><td><b>${peso(r.total)}</b></td>${buckets.map(b => cell(r[b.key])).join('')}</tr>`;
    });
    t += `<tr class="tot"><td class="l" colspan="4">Total</td><td>${peso(sum(O,'total'))}</td>${buckets.map(b => cell(sum(O, b.key))).join('')}</tr>`;
    entries = `<h2>Payment entries</h2><div class="wrap" style="max-height:55vh"><table>${t}</table></div>`;
  }
  return { panel, entries };
}

function checksPanel(I, O) {
  const fi = view === 'out' ? [] : issuesIn(I), fo = view === 'in' ? [] : issuesOut(O);
  let h = '<h2 class="sec">Checks</h2>';
  if (!fi.length && !fo.length) return h + '<span class="pill ok">All entries balance</span>';
  if (fi.length) h += `<div class="muted" style="margin-top:4px">Collections</div><ul class="flags">${fi.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
  if (fo.length) h += `<div class="muted" style="margin-top:6px">Payments</div><ul class="flags">${fo.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
  return h;
}

function render() {
  $('day').value = curDay || '';
  $('month').value = curMonth || '';
  $('dayCtl').style.display = mode === 'day' ? '' : 'none';
  $('monthCtl').style.display = mode === 'month' ? '' : 'none';
  $('mDay').classList.toggle('on', mode === 'day');
  $('mMonth').classList.toggle('on', mode === 'month');
  $('allLines').classList.toggle('on', showAll);
  ['Both','In','Out'].forEach(v => $('v' + v).classList.toggle('on', view === v.toLowerCase()));
  const I = view === 'out' ? [] : scope(cols);
  const O = view === 'in' ? [] : scope(pays);
  renderPosition(scope(cols), scope(pays));
  renderMonthDays(I, O);
  const pi = view === 'out' ? null : inPanel(I);
  const po = view === 'in' ? null : outPanel(O);
  $('sumGrid').innerHTML = [pi && pi.panel, po && po.panel, checksPanel(I, O)].filter(Boolean).map(x => `<div>${x}</div>`).join('');
  $('entries').innerHTML = (pi ? pi.entries : '') + (po ? po.entries : '');
}

function step(dir) {
  const days = allDays();
  if (!days.length) return;
  if (dir < 0) { const p = days.filter(d => d < curDay); if (p.length) curDay = p[p.length - 1]; }
  else { const q = days.filter(d => d > curDay); if (q.length) curDay = q[0]; }
  curMonth = curDay.slice(0, 7);
  render();
}

$('vBoth').onclick = () => { view = 'both'; render(); };
$('vIn').onclick = () => { view = 'in'; render(); };
$('vOut').onclick = () => { view = 'out'; render(); };
$('mDay').onclick = () => { mode = 'day'; render(); };
$('mMonth').onclick = () => { mode = 'month'; curMonth = (curDay || '').slice(0, 7) || curMonth; render(); };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('latest').onclick = () => { const d = allDays().pop(); if (d) { curDay = d; curMonth = d.slice(0, 7); render(); } };
$('day').onchange = e => { if (e.target.value) { curDay = e.target.value; curMonth = curDay.slice(0, 7); render(); } };
$('month').onchange = e => { if (e.target.value) { curMonth = e.target.value; render(); } };
$('handler').onchange = render;
$('allLines').onclick = () => { showAll = !showAll; render(); };
$('print').onclick = () => window.print();

// Reload when the linked table changes (new entries from Quick Entry show up without a page refresh).
let timer = null;
grist.ready({ requiredAccess: 'full' });
grist.onRecords(() => { clearTimeout(timer); timer = setTimeout(load, 400); });
labelsFromDoc().then(load);
</script>
</body>
</html>
