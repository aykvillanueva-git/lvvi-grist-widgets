name: Backfill Contribution_Remittances channel (one-off)

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backfill
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python3 scripts/backfill_contrib_channel.py
