name: Refresh LVVI Fund Balance

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fund refresh
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
        run: python3 scripts/fund_refresh.py

      - name: Commit fund balance snapshot
        run: |
          git config user.name "lvvi-fund-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fund_balance.json
          if git diff --cached --quiet; then
            echo "No balance change to commit"
          else
            git commit -m "Update fund balance snapshot [skip ci]"
            git push
          fi
