<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2Z New Collection Entry</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>

  :root {
    --bg: #fff;
    --card-bg: #f7f6f2;
    --border: #dfdcd3;
    --muted: #6b6a66;
    --text: #1f1e1c;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --danger: #a32d2d;
    --danger-bg: #fcebeb;
    --success: #3b6d11;
    --success-bg: #eaf3de;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #26282c;
      --card-bg: #303338;
      --border: #45484e;
      --muted: #9a9da2;
      --text: #eceef0;
      --accent: #5b9bd5;
      --accent-bg: #2b3a4a;
      --danger: #e88a8a;
      --danger-bg: #4a2b2b;
      --success: #93c47d;
      --success-bg: #2b3f26;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    margin: 0;
    padding: 10px;
    background: var(--bg);
    font-size: 14px;
  }
  h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  h2.entry-emphasis {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 7px;
  }
  h2.section-highlight {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  section {
    margin-bottom: 11px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border);
  }
  section:last-of-type { border-bottom: none; }
  .row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px 8px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  label .req { color: var(--danger); }
  input, select {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-bg);
  }
  input[type="checkbox"] {
    width: auto;
    height: auto;
    margin-top: 4px;
  }
  .date-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .date-wrap input[type="text"] {
    padding-right: 34px;
    font-variant-numeric: tabular-nums;
  }
  .date-wrap input.invalid {
    border-color: var(--danger);
  }
  .date-pick-btn {
    position: absolute;
    right: 4px;
    top: 4px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
  }
  .date-pick-btn:hover { background: var(--card-bg); color: var(--text); }
  .native-date-hidden {
    position: absolute;
    width: 26px;
    height: 26px;
    right: 4px;
    top: 4px;
    opacity: 0;
    pointer-events: none;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 34px;
  }
  .metric {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 5px 6px;
  }
  .metric label { margin-bottom: 1px; }
  .metric .value { font-size: 18px; font-weight: 600; }
  .check-ok { color: var(--success); }
  .check-error { color: var(--danger); }
  .new-client-fields {
    margin-top: 6px;
    padding: 6px;
    background: var(--accent-bg);
    border-radius: var(--radius);
  }
  .new-client-fields .tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
    display: block;
  }
  .hidden { display: none !important; }
  .section-compact {
    margin-bottom: 5px;
    padding-bottom: 4px;
  }
  .section-compact h2 {
    margin-bottom: 3px;
  }
  .inline-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .inline-row > label {
    margin-bottom: 0;
    white-space: nowrap;
  }
  .inline-row input {
    flex: 1;
    min-width: 160px;
  }
  .totals-inline h2 {
    margin: 0;
  }
  .totals-inline .metric {
    display: flex;
    align-items: baseline;
    gap: 4px;
    padding: 3px 6px;
  }
  .totals-inline .metric label {
    margin-bottom: 0;
  }
  button#save-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#save-btn:disabled { opacity: 0.6; cursor: default; }
  button#save-btn:hover:not(:disabled) { background: #0c447c; }
  .footer-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  #status-msg {
    font-size: 13px;
  }
  #status-msg.error { color: var(--danger); }
  #status-msg.success { color: var(--success); }
  datalist { }
  .cash-balance-inline {
    display: none;
    align-items: baseline;
    gap: 6px;
    font-size: 13px;
    font-weight: normal;
    color: var(--muted);
    margin-left: 6px;
  }
  .cash-balance-inline strong { color: var(--text); }
  .title-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 2px;
  }

  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .hint.warn { color: var(--danger); }
  .subhead { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 8px 0 3px; }
  .subhead:first-of-type { margin-top: 0; }
  .metric.bad .value { color: var(--danger); }
  .metric.good .value { color: var(--success); }
  .proj-info { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .proj-info strong { color: var(--text); }
  label .opt { color: var(--muted); font-weight: normal; }

</style>
</head>
<body>

<!--
  A2Z Renewables Corp. (DBA A2Z Solar) -- New Collection Entry, v1.
  Grist doc "a2z daily cash report" (bGyqoZAsrtACQaTTTTcoSG), table Daily_cash_collections.
  Modeled on LVVI new_collection_entry_widget_v7. Differences:
   - Client -> Project (Ref:Projects, shown by client name); a new project can be added inline.
   - Milestone (40/40/20) + one-click fill of the milestone amount from the contract price.
   - Deposited To (Ref:Cash_Accounts) with the account's live balance.
   - Distribution lines must equal Amount Received exactly (no balancing figure like LVVI's tax line).
   - CWT withheld (2307) is entered separately: not cash, not part of Amount Received.
-->

<section>
  <div class="title-row">
    <h2 class="entry-emphasis">A2Z Collections</h2>
    <span class="cash-balance-inline" id="cash-balance-bar">
      <span id="cash-balance-text"></span>
    </span>
  </div>
  <div class="row">
    <div>
      <label>Date <span class="req">*</span></label>
      <div class="date-wrap">
        <input type="text" id="f-date" placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10">
        <button type="button" class="date-pick-btn" id="f-date-pick" tabindex="-1" aria-label="Pick date">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </button>
        <input type="date" id="f-date-native" class="native-date-hidden" tabindex="-1">
      </div>
    </div>
    <div>
      <label>Encoded by <span class="req">*</span></label>
      <select id="f-encoded-by">
        <option value="MEG">MEG</option>
        <option value="Ayk">Ayk</option>
        <option value="Erika">Erika</option>
      </select>
    </div>
    <div>
      <label>Deposited To <span class="req">*</span></label>
      <select id="f-account"></select>
    </div>
  </div>
</section>

<section class="section-compact">
  <div class="inline-row">
    <label>Project / Client <span class="opt">(blank for capital, loans, interest)</span></label>
    <input type="text" id="f-project" list="project-list" placeholder="Type the client name" autocomplete="off">
  </div>
  <datalist id="project-list"></datalist>
  <div class="proj-info" id="proj-info"></div>
  <div class="new-client-fields hidden" id="new-project-box">
    <span class="tag">New project &mdash; will be added to Projects</span>
    <div class="row">
      <div>
        <label>Project Site</label>
        <input type="text" id="f-np-site" placeholder="Brgy., Town">
      </div>
      <div>
        <label>Job Type</label>
        <select id="f-np-type">
          <option value="Supply &amp; Install">Supply &amp; Install</option>
          <option value="Upgrade / Addendum">Upgrade / Addendum</option>
          <option value="Repair / Recommissioning">Repair / Recommissioning</option>
          <option value="Labor-only Subcontract">Labor-only Subcontract</option>
          <option value="Materials Sale">Materials Sale</option>
          <option value="Maintenance / Cleaning">Maintenance / Cleaning</option>
        </select>
      </div>
      <div>
        <label>Contract Price</label>
        <input type="number" id="f-np-price" step="1" placeholder="0">
      </div>
      <div>
        <label>Ref No.</label>
        <input type="text" id="f-np-ref" placeholder="A2Z-2026-MMDD-XX">
      </div>
    </div>
  </div>
</section>

<section>
  <div class="row">
    <div>
      <label>Received From / OR No.</label>
      <input type="text" id="f-payor" placeholder="Payor, OR/AR number">
    </div>
    <div>
      <label>Milestone</label>
      <select id="f-milestone">
        <option value="">&mdash;</option>
        <option value="40% Upon Signing">40% Upon Signing</option>
        <option value="40% Before Purchase of Materials">40% Before Purchase of Materials</option>
        <option value="20% Upon Commissioning">20% Upon Commissioning</option>
        <option value="Full Payment">Full Payment</option>
        <option value="Addendum / Upgrade">Addendum / Upgrade</option>
        <option value="Partial / Other">Partial / Other</option>
      </select>
      <div class="hint" id="milestone-hint"></div>
    </div>
    <div>
      <label>Method <span class="req">*</span></label>
      <select id="f-method">
        <option value="Cash">Cash</option>
        <option value="GCash">GCash</option>
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="Check">Check</option>
        <option value="Credit Card (PocketPay)">Credit Card (PocketPay)</option>
      </select>
    </div>
    <div>
      <label>Amount Received <span class="req">*</span></label>
      <input type="number" id="f-amount" step="1" placeholder="0">
    </div>
  </div>
</section>

<section>
  <h2>Distribution</h2>
  <div class="subhead">Revenue</div>
  <div class="row">
    <div><label>Contract Payment</label><input type="number" id="f-contract" step="1" placeholder="0"></div>
    <div><label>Addendum / Upgrade</label><input type="number" id="f-addendum" step="1" placeholder="0"></div>
    <div><label>Service / Labor Fees</label><input type="number" id="f-service" step="1" placeholder="0"></div>
    <div><label>Materials Sale</label><input type="number" id="f-materials" step="1" placeholder="0"></div>
    <div><label>Other Income</label><input type="number" id="f-other" step="1" placeholder="0"></div>
  </div>
  <div class="subhead">Not revenue</div>
  <div class="row">
    <div><label>Stockholder Advances / Loans</label><input type="number" id="f-advances" step="1" placeholder="0"></div>
    <div><label>Capital Infusion</label><input type="number" id="f-capital" step="1" placeholder="0"></div>
    <div><label>Refunds / CA Returns</label><input type="number" id="f-refunds" step="1" placeholder="0"></div>
  </div>
  <div class="subhead">Not cash</div>
  <div class="row">
    <div>
      <label>CWT Withheld by Client (2307)</label>
      <input type="number" id="f-cwt" step="1" placeholder="0">
      <div class="hint">Tax the client deducted. Not part of Amount Received; counts toward what the client has paid.</div>
    </div>
  </div>
</section>

<section class="section-compact">
  <div class="inline-row totals-inline">
    <h2>Totals &amp; status</h2>
    <div class="metric"><label>Revenue</label><div class="value" id="calc-revenue">P0</div></div>
    <div class="metric"><label>Not revenue</label><div class="value" id="calc-nonrev">P0</div></div>
    <div class="metric" id="unalloc-box"><label>Unallocated</label><div class="value" id="calc-unalloc">P0</div></div>
  </div>
  <div class="hidden"><div id="calc-label">&mdash;</div></div>
</section>

<div class="footer-row" style="margin-top:0; padding-top:7px;">
  <button id="save-btn">Save entry</button>
  <span id="status-msg"></span>
</div>

<script>
let projects = [];  // {id, client, ref, price, collected, balance}
let accounts = [];  // {id, name, balance}

const DIST_IDS = ['f-contract','f-addendum','f-service','f-materials','f-other','f-advances','f-capital','f-refunds'];
const MILESTONE_PCT = {
  '40% Upon Signing': 0.40,
  '40% Before Purchase of Materials': 0.40,
  '20% Upon Commissioning': 0.20
};

function num(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}
function peso(n) { return 'P' + Math.round(n).toLocaleString(); }
function peso2(n) {
  return 'P' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function findProject(name) {
  const key = (name || '').trim().toLowerCase();
  if (!key) return null;
  return projects.find(p => p.client.trim().toLowerCase() === key) ||
         projects.find(p => (p.ref || '').trim().toLowerCase() === key) || null;
}

function recompute() {
  const revenue = num('f-contract') + num('f-addendum') + num('f-service') + num('f-materials') + num('f-other');
  const nonrev = num('f-advances') + num('f-capital') + num('f-refunds');
  const unalloc = Math.round(num('f-amount') - revenue - nonrev);
  document.getElementById('calc-revenue').textContent = peso(revenue);
  document.getElementById('calc-nonrev').textContent = peso(nonrev);
  document.getElementById('calc-unalloc').textContent = peso(unalloc);
  const box = document.getElementById('unalloc-box');
  box.className = 'metric ' + (unalloc === 0 ? 'good' : 'bad');
  const dateVal = document.getElementById('f-date').value;
  const proj = document.getElementById('f-project').value.trim();
  document.getElementById('calc-label').textContent = (dateVal || '—') + ' - ' + (proj || 'No project');
  updateMilestoneHint();
}

function updateProjectBox() {
  const name = document.getElementById('f-project').value.trim();
  const match = findProject(name);
  const box = document.getElementById('new-project-box');
  const info = document.getElementById('proj-info');
  if (name && !match) {
    box.classList.remove('hidden');
    info.textContent = '';
  } else {
    box.classList.add('hidden');
    if (match && match.price) {
      info.innerHTML = 'Contract <strong>' + peso(match.price) + '</strong> &middot; collected <strong>' +
        peso(match.collected) + '</strong> &middot; balance due <strong>' + peso(match.balance) + '</strong>';
    } else {
      info.textContent = '';
    }
  }
  updateMilestoneHint();
}

function currentContractPrice() {
  const match = findProject(document.getElementById('f-project').value);
  if (match) return match.price || 0;
  return num('f-np-price');
}

function updateMilestoneHint() {
  const hint = document.getElementById('milestone-hint');
  const ms = document.getElementById('f-milestone').value;
  const pct = MILESTONE_PCT[ms];
  const price = currentContractPrice();
  if (pct && price) {
    const due = Math.round(price * pct);
    hint.innerHTML = 'Due: ' + peso(due) + ' &middot; <a href="#" id="fill-milestone">fill</a>';
    document.getElementById('fill-milestone').onclick = (e) => {
      e.preventDefault();
      if (!num('f-amount')) document.getElementById('f-amount').value = due;
      document.getElementById('f-contract').value = due;
      recompute();
    };
  } else if (ms === 'Full Payment' && price) {
    const match = findProject(document.getElementById('f-project').value);
    const bal = match ? match.balance : price;
    hint.innerHTML = 'Balance due: ' + peso(bal) + ' &middot; <a href="#" id="fill-milestone">fill</a>';
    document.getElementById('fill-milestone').onclick = (e) => {
      e.preventDefault();
      if (!num('f-amount')) document.getElementById('f-amount').value = bal;
      document.getElementById('f-contract').value = bal;
      recompute();
    };
  } else {
    hint.textContent = '';
  }
}

function updateCashBar() {
  const bar = document.getElementById('cash-balance-bar');
  const text = document.getElementById('cash-balance-text');
  const id = parseInt(document.getElementById('f-account').value, 10);
  const acct = accounts.find(a => a.id === id);
  if (!acct) { bar.style.display = 'none'; return; }
  text.innerHTML = '\u{1F4B5} ' + acct.name + ' (live): <strong>' + peso2(acct.balance) + '</strong>';
  bar.style.display = 'inline-flex';
}

[...DIST_IDS, 'f-amount', 'f-date', 'f-cwt'].forEach(id => {
  document.getElementById(id).addEventListener('input', recompute);
});
document.getElementById('f-project').addEventListener('input', () => { updateProjectBox(); recompute(); });
document.getElementById('f-np-price').addEventListener('input', updateMilestoneHint);
document.getElementById('f-milestone').addEventListener('change', updateMilestoneHint);
document.getElementById('f-account').addEventListener('change', updateCashBar);

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function wireDateField(textId, nativeId, btnId) {
  const textEl = document.getElementById(textId);
  const nativeEl = document.getElementById(nativeId);
  const btnEl = document.getElementById(btnId);
  btnEl.addEventListener('click', () => {
    if (DATE_RE.test(textEl.value)) nativeEl.value = textEl.value;
    if (nativeEl.showPicker) { nativeEl.showPicker(); } else { nativeEl.focus(); nativeEl.click(); }
  });
  nativeEl.addEventListener('input', () => {
    if (nativeEl.value) {
      textEl.value = nativeEl.value;
      textEl.classList.remove('invalid');
      textEl.dispatchEvent(new Event('input'));
    }
  });
  textEl.addEventListener('blur', () => {
    if (textEl.value && !DATE_RE.test(textEl.value)) textEl.classList.add('invalid');
    else textEl.classList.remove('invalid');
  });
  textEl.addEventListener('input', () => textEl.classList.remove('invalid'));
}
wireDateField('f-date', 'f-date-native', 'f-date-pick');

function setStatus(msg, kind) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = kind || '';
}

async function loadAccounts() {
  try {
    const t = await grist.docApi.fetchTable('Cash_Accounts');
    const prev = document.getElementById('f-account').value;
    accounts = (t.id || []).map((id, i) => ({ id, name: t.account[i] || ('#' + id), balance: t.balance[i] || 0 }));
    const sel = document.getElementById('f-account');
    sel.innerHTML = '';
    accounts.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      sel.appendChild(opt);
    });
    if (prev) sel.value = prev;
    updateCashBar();
  } catch (e) {
    setStatus('Could not load Cash_Accounts: ' + (e && e.message ? e.message : e), 'error');
  }
}

async function loadProjects() {
  try {
    const t = await grist.docApi.fetchTable('Projects');
    projects = (t.id || []).map((id, i) => ({
      id,
      client: t.client[i] || '',
      ref: t.ref_no[i] || '',
      price: t.contract_price[i] || 0,
      collected: t.collected[i] || 0,
      balance: t.balance_due[i] || 0,
      status: t.status[i] || ''
    }));
    const dl = document.getElementById('project-list');
    dl.innerHTML = '';
    [...projects].sort((a, b) => a.client.localeCompare(b.client, undefined, { sensitivity: 'base' }))
      .forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.client;
        opt.label = [p.ref, p.status].filter(Boolean).join(' · ');
        dl.appendChild(opt);
      });
    updateProjectBox();
  } catch (e) { /* autocomplete just won't populate */ }
}

async function loadDefaults() {
  let dateSet = false;
  try {
    const t = await grist.docApi.fetchTable('Daily_cash_collections');
    const ids = t.id || [];
    if (ids.length) {
      let maxIdx = 0;
      for (let i = 1; i < ids.length; i++) if (ids[i] > ids[maxIdx]) maxIdx = i;
      if (t.date[maxIdx]) {
        document.getElementById('f-date').value = new Date(t.date[maxIdx] * 1000).toISOString().slice(0, 10);
        dateSet = true;
      }
      if (t.encoded_by[maxIdx]) document.getElementById('f-encoded-by').value = t.encoded_by[maxIdx];
      if (t.method[maxIdx]) document.getElementById('f-method').value = t.method[maxIdx];
      if (t.account[maxIdx]) document.getElementById('f-account').value = t.account[maxIdx];
    }
  } catch (e) { /* fall through */ }
  if (!dateSet) document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
  updateCashBar();
  recompute();
}

function resetFormAfterSave() {
  ['f-project','f-payor','f-amount','f-cwt','f-np-site','f-np-price','f-np-ref', ...DIST_IDS]
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f-milestone').value = '';
  updateProjectBox();
  recompute();
}

document.getElementById('save-btn').addEventListener('click', async () => {
  const date = document.getElementById('f-date').value;
  const encodedBy = document.getElementById('f-encoded-by').value;
  const accountId = parseInt(document.getElementById('f-account').value, 10);
  const method = document.getElementById('f-method').value;
  const amount = num('f-amount');
  const projName = document.getElementById('f-project').value.trim();

  if (!date || !encodedBy || !accountId || !method || !amount) {
    setStatus('Fill in date, encoded by, deposited to, method and amount before saving.', 'error');
    return;
  }
  if (!DATE_RE.test(date)) { setStatus('Date must be in YYYY-MM-DD format.', 'error'); return; }
  const revenue = num('f-contract') + num('f-addendum') + num('f-service') + num('f-materials') + num('f-other');
  const nonrev = num('f-advances') + num('f-capital') + num('f-refunds');
  const unalloc = Math.round(amount - revenue - nonrev);
  if (unalloc !== 0) {
    setStatus(unalloc > 0
      ? 'P' + unalloc.toLocaleString() + ' of the amount is not yet assigned to a line.'
      : 'Distribution lines exceed the amount received by P' + Math.abs(unalloc).toLocaleString() + '.', 'error');
    return;
  }
  if ((num('f-contract') || num('f-addendum')) && !projName) {
    setStatus('Contract/addendum payments need a project.', 'error');
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Saving...', '');
  try {
    let projectId = 0;
    if (projName) {
      const match = findProject(projName);
      if (match) {
        projectId = match.id;
      } else {
        const res = await grist.docApi.applyUserActions([
          ['AddRecord', 'Projects', null, {
            client: projName,
            site: document.getElementById('f-np-site').value.trim(),
            job_type: document.getElementById('f-np-type').value,
            contract_price: num('f-np-price') || null,
            ref_no: document.getElementById('f-np-ref').value.trim(),
            status: 'Signed'
          }]
        ]);
        projectId = res.retValues[0];
      }
    }
    const rec = {
      encoded_by: encodedBy,
      date: Math.floor(new Date(date + 'T00:00:00Z').getTime() / 1000),
      account: accountId,
      method: method,
      payor: document.getElementById('f-payor').value.trim(),
      milestone: document.getElementById('f-milestone').value,
      amount: amount,
      contract_payment: num('f-contract'),
      addendum_payment: num('f-addendum'),
      service_fees: num('f-service'),
      materials_sale: num('f-materials'),
      other_income: num('f-other'),
      stockholder_advances: num('f-advances'),
      capital_infusion: num('f-capital'),
      refunds_returns: num('f-refunds'),
      cwt_withheld: num('f-cwt')
    };
    if (projectId) rec.project = projectId;
    await grist.docApi.applyUserActions([['AddRecord', 'Daily_cash_collections', null, rec]]);
    setStatus('Saved: ' + document.getElementById('calc-label').textContent + ' — ' + peso(amount), 'success');
    resetFormAfterSave();
    loadProjects();
    loadAccounts();
  } catch (e) {
    setStatus('Could not save: ' + (e && e.message ? e.message : e), 'error');
  } finally {
    btn.disabled = false;
  }
});

grist.ready({ requiredAccess: 'full' });
loadAccounts().then(loadDefaults);
loadProjects();

// Keep balances fresh after entries made in the payment widget.
setInterval(() => { loadAccounts(); loadProjects(); }, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { loadAccounts(); loadProjects(); }
});
window.addEventListener('focus', () => { loadAccounts(); loadProjects(); });
</script>
</body>
</html>
